
name: Pronosticos

on:
  schedule:
    - cron: "*/10 * * * *"     # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:            # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pronosticos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      TZ: America/Bogota
      CARPETA_DATOS: datos
      DIAS_HISTORIAL: "21"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar historial guardado
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Analizar y generar el panel
        run: python esports_prediccion.py --estatico sitio

      - name: Guardar historial
        if: always()
        uses: actions/cache/save@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: publicar
        uses: actions/deploy-pages@v4
